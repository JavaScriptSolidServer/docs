<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-label="E2EE architecture: Client A encrypts with a key derived from ECDH(privA, pubB) and PUTs ciphertext to the JSS pod; Client B GETs the ciphertext and decrypts it with a key derived from ECDH(privB, pubA); the pod stores ciphertext only and never sees plaintext.">
  <defs>
    <style>
      .box        { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .pod-box    { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .title      { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .id         { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .code       { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .note       { font: 500 12px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .flow       { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #7c3aed; }
      .arrow      { stroke: #7c3aed; stroke-width: 2.5; fill: none; }
      .divider    { stroke: #cbd5e1; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Client A -->
  <rect class="box" x="20" y="40" width="220" height="200" rx="8"/>
  <text class="title" x="130" y="68" text-anchor="middle">Client A</text>
  <text class="id"    x="130" y="90" text-anchor="middle">did:nostr:A</text>
  <line  class="divider" x1="40" y1="105" x2="220" y2="105"/>
  <text class="code" x="130" y="135" text-anchor="middle">key = ECDH(privA, pubB)</text>
  <text class="code" x="130" y="170" text-anchor="middle">ct = nip44.encrypt(</text>
  <text class="code" x="130" y="188" text-anchor="middle">  plaintext, key)</text>

  <!-- JSS pod -->
  <rect class="pod-box" x="310" y="100" width="200" height="80" rx="8"/>
  <text class="title" x="410" y="130" text-anchor="middle">JSS pod</text>
  <text class="id"    x="410" y="155" text-anchor="middle">stores ciphertext</text>
  <text class="note"  x="410" y="205" text-anchor="middle">never sees plaintext</text>

  <!-- Client B -->
  <rect class="box" x="580" y="40" width="220" height="200" rx="8"/>
  <text class="title" x="690" y="68" text-anchor="middle">Client B</text>
  <text class="id"    x="690" y="90" text-anchor="middle">did:nostr:B</text>
  <line  class="divider" x1="600" y1="105" x2="780" y2="105"/>
  <text class="code" x="690" y="135" text-anchor="middle">key = ECDH(privB, pubA)</text>
  <text class="code" x="690" y="170" text-anchor="middle">pt = nip44.decrypt(</text>
  <text class="code" x="690" y="188" text-anchor="middle">  ct, key)</text>

  <!-- A → pod (PUT ciphertext) -->
  <path class="arrow" d="M 240 125 L 310 125" marker-end="url(#arrowhead)"/>
  <text class="flow" x="275" y="118" text-anchor="middle">PUT ct</text>

  <!-- pod → B (GET ciphertext) -->
  <path class="arrow" d="M 510 155 L 580 155" marker-end="url(#arrowhead)"/>
  <text class="flow" x="545" y="148" text-anchor="middle">GET ct</text>
</svg>
